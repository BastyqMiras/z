<!DOCTYPE html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Тренажёр</title></head><body><script>
(async()=>{
  const r=await fetch('./app.html?v=contrast-20261020',{cache:'no-store'});
  let html=await r.text();
  const css=`<style id="contrast-hotfix">
  :root{--bg:#e8eef7!important;--t:#111827!important;--m:#111827!important;--line:#94a3b8!important}
  body{background:linear-gradient(180deg,#dfe7f2 0%,#eef2f7 100%)!important;color:#111827!important}
  .card{border:2px solid #a8b6ca!important;box-shadow:0 16px 38px rgba(30,41,59,.14)!important}
  .home-card{background:#f8fafc!important;border-color:#94a3b8!important}
  .home-card h2{color:#0f172a!important}
  .s{color:#1f2937!important;font-weight:700!important}
  .home-card label{background:#cbd5e1!important;border:1.5px solid #94a3b8!important;color:#0f172a!important;font-weight:700!important}
  .home-card #nm,input[type=text]{background:#fff!important;border:2px solid #64748b!important;color:#0f172a!important}
  .home-card #nm::placeholder,input[type=text]::placeholder{color:#475569!important;opacity:1!important}
  button.g{background:#b8c5d8!important;color:#0f172a!important;border:1.5px solid #71839f!important;font-weight:800!important}
  .card>div[style*="text-align:right"] button.g{background:#334155!important;color:#fff!important;border-color:#334155!important}
  .card>div[style*="text-align:right"] button.g:hover{background:#1e293b!important}
  details{background:#d7e0ec!important;border:1.5px solid #94a3b8!important;color:#0f172a!important}
  summary{color:#0f172a!important;font-weight:800!important}
  th{background:#cbd8e8!important;color:#172554!important}
  td{color:#111827!important}
  .ex{background:#cbd8ea!important;border-color:#8fa6c6!important;color:#172554!important}
  .bar{background:#aebdd2!important}
  @media(max-width:420px){.home-card{padding:17px!important}.home-card label{padding:13px!important}}
  </style>`;
  html=html.replace('</head>',css+'</head>').replace('· v3','· v4');
  document.open();document.write(html);document.close();
})().catch(e=>{document.body.innerHTML='<p style="font:16px system-ui;padding:20px">Ошибка загрузки тренажёра. Обновите страницу.</p>';console.error(e)});
</script></body></html>
